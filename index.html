<title>Machbondhu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0F5F55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky title bar, scrolling content, fixed 5-tab bar with big picture labels */
:root{
  --pond:#0F5F55;        /* deep pond green: primary */
  --pond-2:#E3F0EC;      /* pale water tint */
  --turmeric:#D9921A;    /* due tasks, premium */
  --ink:#16302B;         /* body text */
  --ink-2:#4E6660;       /* secondary text */
  --paper:#F4F7F3;       /* page */
  --card:#FFFFFF;
  --line:#D5E2DC;
  --safe:#23874F; --safe-bg:#E2F3E8;
  --watch:#B7740B; --watch-bg:#FBF0DA;
  --danger:#C62F24; --danger-bg:#FBE3E0;
  --lock:#7A5AA6;
  --shadow:0 1px 2px rgba(15,60,50,.08),0 4px 14px rgba(15,60,50,.06);
  --f-display:"Baloo Da 2","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --f-body:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;
  --tab-h:72px;
  --bar:#0F5F55;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pond:#4FC2AE; --pond-2:#16302C; --turmeric:#F0B347; --ink:#E7F0EC; --ink-2:#A6BDB6;
  --paper:#0D1A18; --card:#14241F; --line:#27403A;
  --safe:#5BCB8A; --safe-bg:#143224; --watch:#F0B347; --watch-bg:#33280F; --danger:#FF7C6E; --danger-bg:#3A1714; --lock:#B79BE0;
  --shadow:0 1px 2px rgba(0,0,0,.4); --bar:#0F3E37; color-scheme:dark}}
:root[data-theme="dark"]{
  --pond:#4FC2AE; --pond-2:#16302C; --turmeric:#F0B347; --ink:#E7F0EC; --ink-2:#A6BDB6;
  --paper:#0D1A18; --card:#14241F; --line:#27403A;
  --safe:#5BCB8A; --safe-bg:#143224; --watch:#F0B347; --watch-bg:#33280F; --danger:#FF7C6E; --danger-bg:#3A1714; --lock:#B79BE0;
  --shadow:0 1px 2px rgba(0,0,0,.4); --bar:#0F3E37; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff;
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;min-height:60px}
.top h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.iconbtn{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.14);display:grid;place-items:center;cursor:pointer;flex:none;color:#fff}
.iconbtn svg{width:26px;height:26px}
.langbtn{height:40px;padding:0 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:600;cursor:pointer}
.planchip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--turmeric);color:#2a1c00}

/* Main */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--tab-h) + 100px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-size:21px;font-weight:600;margin:6px 0 0;line-height:1.25;text-wrap:balance}
h3{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0;line-height:1.3}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.demo-tag{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:6px;padding:0 6px;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row > .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}

/* Big buttons */
.btn{min-height:56px;border-radius:16px;border:0;padding:10px 18px;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;line-height:1.25}
.btn svg{width:26px;height:26px;flex:none}
.btn.primary{background:var(--pond);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#062420}}
:root[data-theme="dark"] .btn.primary{color:#062420}
.btn.ghost{background:var(--pond-2);color:var(--ink)}
.btn.warn{background:var(--turmeric);color:#2a1c00}
.btn.danger{background:var(--danger);color:#fff}
.btn.line{background:transparent;border:2px solid var(--line)}
.btn.full{width:100%}
.btn.sm{min-height:44px;font-size:16px;border-radius:12px;padding:6px 14px}
.btn[disabled]{opacity:.45}

/* Tiles (picture menu) */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-align:center;font-weight:600;font-size:17px;line-height:1.25;box-shadow:var(--shadow);position:relative}
.tile .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--pond-2);color:var(--pond)}
.tile .ic svg{width:32px;height:32px}
.tile .lockb{position:absolute;top:8px;right:8px;width:24px;height:24px;color:var(--lock)}
.tile.sel{outline:3px solid var(--pond);background:var(--pond-2)}

/* Pond card */
.pond-head{display:flex;gap:12px;align-items:center}
.ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;border:6px solid var(--safe);background:var(--safe-bg);color:var(--safe)}
.ring svg{width:26px;height:26px}
.ring.watch{border-color:var(--watch);background:var(--watch-bg);color:var(--watch)}
.ring.danger{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.status-word{font-weight:700;font-size:15px}
.safe-t{color:var(--safe)} .watch-t{color:var(--watch)} .danger-t{color:var(--danger)}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;min-height:60px}
.task .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--pond-2);color:var(--pond)}
.task .ic svg{width:26px;height:26px}
.task.due .ic{background:var(--watch-bg);color:var(--watch)}
.task.late .ic{background:var(--danger-bg);color:var(--danger)}
.task.done{opacity:.7}
.task.done .ic{background:var(--safe-bg);color:var(--safe)}
.task b{display:block;font-size:17px;line-height:1.25}
.task span{font-size:14px;color:var(--ink-2)}

/* Stats */
.stat{background:var(--paper);border-radius:14px;padding:10px 12px;min-width:0}
.stat .k{font-size:14px;color:var(--ink-2);line-height:1.3}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.2}
.stat .v small{font-size:14px;font-family:var(--f-body);font-weight:500;color:var(--ink-2)}
.stat.locked{position:relative}
.stat.locked .v{filter:blur(6px);user-select:none}

/* Alert banner */
.alert{border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;border:2px solid var(--danger);background:var(--danger-bg)}
.alert.watch{border-color:var(--watch);background:var(--watch-bg)}
.alert .ic{color:var(--danger);flex:none} .alert.watch .ic{color:var(--watch)}
.alert .ic svg{width:30px;height:30px}
.alert b{display:block}

/* Weather */
.weather{display:flex;gap:10px;align-items:center;background:linear-gradient(0deg,var(--card),var(--card));border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.weather .wic{color:var(--ink-2)} .weather .wic svg{width:40px;height:40px}
.wcells{display:flex;gap:16px;flex-wrap:wrap}
.wcell b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}

/* Tabs bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:none;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tabs button svg{width:28px;height:28px}
.tabs button.on{color:var(--pond)}
.tabs button.on .pill{background:var(--pond-2)}
.tabs .pill{padding:3px 16px;border-radius:99px;display:grid;place-items:center}

/* FAB */
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));z-index:19;
  height:64px;padding:0 22px 0 18px;border-radius:20px;border:0;background:var(--turmeric);color:#2a1c00;font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.fab svg{width:30px;height:30px}

/* Forms */
label.lbl{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
label.lbl svg{width:24px;height:24px;color:var(--pond)}
.field{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:10px 14px;font-size:18px}
.inp:focus{border-color:var(--pond);outline:none}
textarea.inp{min-height:96px;resize:vertical}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:stretch}
.stepper button{border:0;border-radius:14px;background:var(--pond-2);color:var(--pond);font-size:30px;font-weight:700;cursor:pointer;min-height:60px}
.stepper input{text-align:center;font-family:var(--f-display);font-weight:600;font-size:26px;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);width:100%;min-width:0}
.unit{font-size:15px;color:var(--ink-2);text-align:center}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:6px 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.sel{border-color:var(--pond);background:var(--pond);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.sel{color:#062420}}
:root[data-theme="dark"] .chip.sel{color:#062420}
.chip svg{width:20px;height:20px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn .chip{justify-content:center;border-radius:14px;min-height:56px}

/* Swatches (test-kit colours) */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.sw{border:3px solid transparent;border-radius:14px;padding:0;cursor:pointer;background:var(--card);display:flex;flex-direction:column;overflow:hidden;min-height:72px}
.sw i{display:block;height:44px}
.sw span{font-weight:700;font-size:15px;padding:2px 0}
.sw.sel{border-color:var(--ink)}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--pond-2);color:var(--pond);flex:none}
.li .ic svg{width:24px;height:24px}
.li .grow{flex:1;min-width:0}
.li .amt{font-family:var(--f-display);font-weight:600;font-size:19px;white-space:nowrap}
.plus{color:var(--safe)} .minus{color:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--pond-2);color:var(--pond);white-space:nowrap}
.badge.safe{background:var(--safe-bg);color:var(--safe)} .badge.watch{background:var(--watch-bg);color:var(--watch)} .badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.lock{background:transparent;border:1.5px solid var(--lock);color:var(--lock)}
.badge svg{width:14px;height:14px}

/* Segmented sub-tabs */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:46px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button svg{width:20px;height:20px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Sheet & overlays */
.scrim{position:fixed;inset:0;background:rgba(5,20,17,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:48px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.danger-full{position:fixed;inset:0;z-index:50;background:var(--danger);color:#fff;display:flex;flex-direction:column;
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));gap:16px;overflow:auto}
.danger-full h2{color:#fff;font-size:28px}
.danger-full .step{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.14);border-radius:16px;padding:14px;font-size:19px;font-weight:600}
.danger-full .step b{font-family:var(--f-display);font-size:26px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--danger);display:grid;place-items:center;flex:none}
.danger-full .btn{background:#fff;color:#8f1e16}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--ink);color:var(--paper);
  padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:var(--turmeric);font-weight:700;text-decoration:underline;cursor:pointer;min-height:40px}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:12px;fill:var(--ink-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* Steps / progress */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:28px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--pond)}
.paywall{border:2px solid var(--lock);background:color-mix(in srgb,var(--lock) 8%,var(--card))}
.lockrow{display:flex;gap:10px;align-items:center;color:var(--lock);font-weight:700}
.lockrow svg{width:26px;height:26px}
.check-li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check-li .box{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;color:#fff}
.check-li.ok .box{background:var(--safe);border-color:var(--safe)}
.check-li .box svg{width:20px;height:20px}
.secchi{display:flex;gap:12px;align-items:center}
.secchi svg{width:90px;height:110px;flex:none}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.center{text-align:center}
.big-num{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.1}
.price-up{color:var(--safe)} .price-dn{color:var(--danger)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
@media (max-width:360px){.tiles{gap:8px}.tile{min-height:104px;font-size:16px}.grid3{grid-template-columns:1fr 1fr}}
</style>

<header class="top" id="top"></header>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div id="layer"></div>

  fish: I('<path d="M2 12c3-5 9-7 14-4l4-3v14l-4-3c-5 3-11 1-14-4z"/><circle cx="7" cy="11" r="1" fill="currentColor"/>'),
  feed: I('<path d="M6 4h12l-1 3H7z"/><path d="M7 7c-2 3-2 9 0 13h10c2-4 2-10 0-13"/><path d="M10 12h4M10 15h4"/>'),
  drop: I('<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>'),

  money: I('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 10v4M18 10v4"/>'),

  back: I('<path d="M15 5l-7 7 7 7"/>'),
  next: I('<path d="M9 5l7 7-7 7"/>'),
  check: I('<path d="M5 13l4 4L19 7"/>'),
  alert: I('<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>'),
  cloud: I('<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>'),

}
const tk = x => (x < 0 ? '−৳' : '৳') + n(Math.abs(Math.round(x)));

const MON_BN = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];

  const [h, m] = hm.split(':').map(Number);

const pondById = id => S.ponds.find(p => p.id === id);
function mainSpecies(pid) {
  const rows = stockRows(pid, true);

  return best ? best.sp : null;
}
function stockRows(pid, skipDeaths) {
  const ev = S.stock.filter(e => e.pondId === pid);
  const by = {};
  ev.forEach(e => {
    const r = by[e.sp] || (by[e.sp] = { sp: e.sp, rel: 0, relW: 0, dead: 0, harv: 0, harvKg: 0, firstDate: e.date });
    if (e.type === 'release') { r.relW = (r.relW * r.rel + e.w * e.count) / (r.rel + e.count || 1); r.rel += e.count; if (e.date < r.firstDate) r.firstDate = e.date; }
    if (e.type === 'death') r.dead += e.count;
    if (e.type === 'harvest') { r.harv += e.count; r.harvKg += e.kg || 0; }
  });
  const rows = Object.values(by);
  rows.forEach(r => {
    const sm = S.samples.filter(x => x.pondId === pid && x.sp === r.sp).sort((a, b) => a.date < b.date ? 1 : -1)[0];
    if (sm) { r.avgW = sm.totalG / sm.n; r.wDate = sm.date; r.measured = true; }
    else { r.avgW = r.relW; r.wDate = r.firstDate; r.measured = false; }
    r.live = Math.max(0, r.rel - r.dead - r.harv);
    r.bio = r.live * r.avgW / 1000;
  });
  if (!skipDeaths && rows.length) {
    const logDeaths = S.logs.filter(l => l.pondId === pid).reduce((a, l) => a + (l.deaths || 0), 0);
    if (logDeaths) {
      const m = rows.slice().sort((a, b) => b.bio - a.bio)[0];
      m.logDead = logDeaths; m.live = Math.max(0, m.live - logDeaths); m.bio = m.live * m.avgW / 1000;
    }
  }
  return rows.filter(r => r.rel > 0).sort((a, b) => b.bio - a.bio);
}
const totalBio = pid => stockRows(pid).reduce((a, r) => a + r.bio, 0);
const totalLive = pid => stockRows(pid).reduce((a, r) => a + r.live, 0);
function latestWater(pid) {
  const rs = S.water.filter(w => w.pondId === pid).sort((a, b) => a.date < b.date ? 1 : -1);
  const out = {};
  rs.forEach(r => Object.keys(PARAMS).forEach(p => { if (out[p] === undefined && r[p] !== undefined && r[p] !== null && r[p] !== '') out[p] = { v: r[p], date: r.date }; }));

}
const WEATHER = () => ({ cloud: 85, air: 31, rain: 40, hi: 33, lo: 25 }); // demo forecast
function feedPlan(pid) {
  const rows = stockRows(pid);
  const w = latestWater(pid).vals;
  const temp = (w.temp && daysAgo(w.temp.date) <= 3) ? w.temp.v : WEATHER().air - 1;
  const kT = temp < 15 ? 0.3 : temp < 20 ? 0.6 : temp < 25 ? 0.85 : temp <= 32 ? 1 : 0.7;
  const doLow = w.do && daysAgo(w.do.date) <= 2 && w.do.v < 3;
  const kDO = doLow ? 0 : 1;
  let mn = 0, mx = 0; const parts = [];
  rows.forEach(r => {
    const sp = SP[r.sp]; if (!sp || sp.nat || r.live <= 0) return;
    const b = FEED[sp.type].find(x => r.avgW <= x[0]);
    const a = r.bio * b[1] / 100 * kT * kDO, z = r.bio * b[2] / 100 * kT * kDO;
    mn += a; mx += z; parts.push({ sp: r.sp, pct: [b[1], b[2]], kg: (a + z) / 2 });
  });
  const ms = mainSpecies(pid);
  const times = ms ? FEED_TIMES[SP[ms].type] : ['08:00', '16:00'];
  const mid = Math.round(((mn + mx) / 2) * 10) / 10;
  return { min: mn, max: mx, kg: mid, perMeal: Math.round(mid / times.length * 10) / 10, times, temp, kT, kDO, parts, doLow };
}
function limeAdvice(ph, area) {
  if (ph === undefined || ph === null) return null;
  if (ph >= 8.5) return { kg: 0, msg: L('pH বেশি — চুন দেবেন না। কিছু পানি বদলান।', 'pH is high — do NOT apply lime. Exchange some water.'), tone: 'danger' };
  if (ph < 6) return { kg: area * 1, msg: L(`প্রতি শতাংশে ১ কেজি — মোট ${n(area)} কেজি চুন দিন`, `1 kg per decimal — apply ${n(area)} kg lime in total`), tone: 'watch' };
  if (ph < 6.5) return { kg: area * 0.5, msg: L(`প্রতি শতাংশে ৫০০ গ্রাম — মোট ${n(area * 0.5, 1)} কেজি চুন দিন`, `500 g per decimal — apply ${n(area * 0.5, 1)} kg lime in total`), tone: 'watch' };
  return { kg: 0, msg: L('pH ঠিক আছে — এখন চুন লাগবে না।', 'pH is fine — no lime needed now.'), tone: 'safe' };
}
function fertAdvice(secchi, area, pid) {
  if (secchi === undefined || secchi === null) return null;
  const ms = pid ? mainSpecies(pid) : null;
  if (ms && SP[ms].cat) return { msg: L('শিং/পাঙ্গাস প্রধান পুকুরে সার লাগে না।', 'Ponds mainly of catfish/pangas need no fertiliser.'), tone: 'safe' };
  const cloudy = WEATHER().cloud > 80;
  if (secchi < 25) return { msg: L('পানি খুব সবুজ — সার দেবেন না।', 'Water is too green — do not fertilise.'), tone: 'watch' };
  if (secchi <= 40) return { msg: L('পানির রং ভালো — এখন সার লাগবে না।', 'Water colour is good — no fertiliser needed now.'), tone: 'safe' };
  const u = secchi > 50 ? 150 : 100, t = secchi > 50 ? 75 : 50;
  const base = L(`ইউরিয়া ${n(u * area / 1000, 1)} কেজি ও টিএসপি ${n(t * area / 1000, 1)} কেজি দিন (প্রতি শতাংশে ${n(u)} ও ${n(t)} গ্রাম)`,
    `Apply urea ${n(u * area / 1000, 1)} kg and TSP ${n(t * area / 1000, 1)} kg (${u} g and ${t} g per decimal)`);
  return { msg: cloudy ? base + L(' — তবে মেঘলা দিন শেষ হলে।', ' — but wait until the cloudy days pass.') : base, tone: 'watch' };
}
function money(pid) {
  const es = S.ledger.filter(e => !pid || e.pondId === pid);
  const exp = es.filter(e => e.kind === 'exp').reduce((a, e) => a + e.amount, 0);
  const inc = es.filter(e => e.kind === 'inc').reduce((a, e) => a + e.amount, 0);

}
function analytics(pid) {
  const rows = stockRows(pid);
  const feedKg = S.logs.filter(l => l.pondId === pid).reduce((a, l) => a + (l.feedKg || 0), 0);
  const harvKg = rows.reduce((a, r) => a + r.harvKg, 0);
  const startBio = rows.reduce((a, r) => a + r.rel * r.relW / 1000, 0);
  const nowBio = rows.reduce((a, r) => a + r.bio, 0);
  const gain = nowBio + harvKg - startBio;
  const fcr = gain > 0 ? feedKg / gain : null;
  const m = money(pid);
  const projKg = rows.reduce((a, r) => a + r.live * Math.max(r.avgW, SP[r.sp].target) / 1000, 0) + harvKg;
  const projIncome = rows.reduce((a, r) => a + r.live * Math.max(r.avgW, SP[r.sp].target) / 1000 * priceOf(r.sp), 0) + m.inc;
  const ms = rows[0];
  let harvestDate = null, daysLeft = null, adg = null;
  if (ms) {
    const sm = S.samples.filter(x => x.pondId === pid && x.sp === ms.sp).sort((a, b) => a.date < b.date ? -1 : 1);
    if (sm.length >= 2) { const a = sm[sm.length - 2], b = sm[sm.length - 1]; adg = (b.totalG / b.n - a.totalG / a.n) / Math.max(1, daysBetween(a.date, b.date)); }
    else if (sm.length === 1) adg = (sm[0].totalG / sm[0].n - ms.relW) / Math.max(1, daysBetween(ms.firstDate, sm[0].date));
    if (!adg || adg <= 0) adg = SP[ms.sp].adg;
    daysLeft = Math.max(0, Math.round((SP[ms.sp].target - ms.avgW) / adg) - daysAgo(ms.wDate));

  }

  const remainingGain = Math.max(0, projKg - nowBio - harvKg);
  const useFcr = fcr ? Math.min(2.2, Math.max(1.2, fcr)) : 1.5;
  const projFeedCost = remainingGain * useFcr * FEED_TK_PER_KG;
  const costPerKg = (nowBio + harvKg) > 0 ? m.exp / (nowBio + harvKg) : null;
  const projCostPerKg = projKg > 0 ? (m.exp + projFeedCost) / projKg : null;

}

function growthChart(pts, sp, nowDay) {
  const W = 340, H = 190, l = 40, r = 12, t = 12, b = 28;
  const maxD = Math.max(nowDay + 30, 120), maxW = Math.max(sp.target * 0.6, ...pts.map(p => p.w)) * 1.15;
  const X = d => l + d / maxD * (W - l - r), Y = w => H - b - w / maxW * (H - t - b);
  const ref = []; for (let d = 0; d <= maxD; d += 10) ref.push([d, Math.min(sp.target, pts[0].w + sp.adg * d)]);
  const stepY = maxW > 600 ? 200 : maxW > 300 ? 100 : 50; const yt = []; for (let v = 0; v <= maxW; v += stepY) yt.push(v);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('বৃদ্ধির চার্ট', 'Growth chart')}">
    ${yt.map(v => `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l - 6}" y="${Y(v) + 4}" text-anchor="end">${n(v)}</text>`).join('')}
    <text x="${l}" y="${H - 8}">${L('দিন', 'day')} ${n(0)}</text><text x="${W - r}" y="${H - 8}" text-anchor="end">${n(maxD)}</text>
    <line x1="${X(nowDay)}" x2="${X(nowDay)}" y1="${t}" y2="${H - b}" stroke="var(--ink-2)" stroke-dasharray="3 3"/><text x="${X(nowDay) + 4}" y="${t + 10}">${L('আজ', 'today')}</text>
    <polyline fill="none" stroke="var(--turmeric)" stroke-width="2" stroke-dasharray="5 4" points="${ref.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>
    <polyline fill="none" stroke="var(--pond)" stroke-width="3" points="${pts.map(p => X(p.d) + ',' + Y(p.w)).join(' ')}"/>
    ${pts.map(p => `<circle cx="${X(p.d)}" cy="${Y(p.w)}" r="4.5" fill="var(--pond)"/>`).join('')}
    <text x="${X(pts[pts.length - 1].d) + 7}" y="${Y(pts[pts.length - 1].w) - 6}" style="fill:var(--ink);font-weight:600">${n(pts[pts.length - 1].w)}${L('গ্রা', 'g')}</text></svg>`;
}

  const title = { release: L('কোন মাছ ছাড়ছেন?', 'Which fish are you stocking?'), death: L('কোন মাছ মরেছে?', 'Which fish died?'), harvest: L('কোন মাছ ধরেছেন?', 'Which fish did you harvest?') }[type];
  const live = rows.find(r => r.sp === UI.se.sp);
  let h = `<div class="card"><h3>${title}</h3><div class="choice">${sps.map(sp => pick('seSp', sp, UI.se.sp, spName(sp), 'fish')).join('')}</div>
    ${live && type !== 'release' ? `<p class="small muted">${L('এখন আছে প্রায়', 'Currently about')} ${n(live.live)} ${L('টি', 'fish')}</p>` : ''}</div><div class="card">`;
  h += `<label class="lbl">${IC.fish}${L('কয়টি মাছ', 'How many fish')}</label>${stepper('se_n', type === 'release' ? 100 : 10, type === 'release' ? 50 : 1, L('টি', 'fish'), 1)}`;
  if (type === 'release') h += `<label class="lbl">${IC.scale}${L('একটি পোনার গড় ওজন', 'Average weight of one fry')}</label>${stepper('se_w', 10, 1, L('গ্রাম', 'grams'), 1)}
    <label class="lbl">${IC.money}${L('প্রতিটি পোনার দাম', 'Price per fry')}</label>${stepper('se_p', SP[UI.se.sp].fry, 0.5, L('টাকা (খরচে যোগ হবে)', 'taka (added to expenses)'), 0)}`;
  if (type === 'harvest') h += `<label class="lbl">${IC.scale}${L('মোট ওজন', 'Total weight')}</label>${stepper('se_kg', 10, 1, L('কেজি', 'kg'), 0)}

function symptomResult() {
  const picks = UI.sym.picks.filter(x => x !== 'normal' && x !== 'none');
  tick('symptom');
  if (!picks.length) return `<div class="card"><h3>${L('কোনো লক্ষণ বাছাই করা হয়নি', 'No signs selected')}</h3><p>${L('মাছ সুস্থ মনে হচ্ছে। নিয়মিত পানি পরীক্ষা চালিয়ে যান।', 'The fish seem healthy. Keep testing water regularly.')}</p>
    <button class="btn ghost full" data-act="symReset">${IC.reset}${L('আবার শুরু', 'Start again')}</button></div>`;
  const scored = DISEASES.map(d => { const hit = d.f.filter(f => picks.includes(f)).length; return { d, score: hit / Math.max(picks.length, 2) + hit * 0.1, hit }; })
    .filter(x => x.hit > 0).sort((a, b) => b.score - a.score).slice(0, 3);
  const max = scored.length ? scored[0].score : 1;
  let h = `<h2>${L('সম্ভাব্য কারণ', 'Likely causes')}</h2><p class="small muted">${L('এটি পরামর্শ মাত্র, চিকিৎসা নয়। নিশ্চিত হতে মৎস্য কর্মকর্তাকে দেখান।', 'This is guidance, not a diagnosis. Show a fisheries officer to be sure.')}</p>`;
  scored.forEach((x, i) => {
    const pct = Math.round(Math.min(95, 45 + 50 * x.score / max) - i * 12);
    h += `<div class="card"><div class="row"><h3 class="grow">${tx(x.d)}</h3><span class="badge ${i === 0 ? 'danger' : 'watch'}">${L('মিল', 'Match')} ${n(pct)}%</span></div>
      <b>${L('এখনই যা করবেন', 'Do this now')}</b>${x.d.aid.map((a, k) => `<div class="row"><span class="badge">${n(k + 1)}</span><span class="grow">${tx(a)}</span></div>`).join('')}
      <button class="btn line sm" data-act="open" data-view="disease" data-id="${x.d.id}">${L('বিস্তারিত', 'Details')}${IC.next}</button></div>`;
  });
  if (!scored.length) h += `<div class="card"><p>${L('মিল পাওয়া যায়নি। বিশেষজ্ঞকে ছবি পাঠান।', 'No match found. Send a photo to an expert.')}</p></div>`;
  h += `<button class="btn warn full" data-act="open" data-view="expert">${IC.doctor}${L('বিশেষজ্ঞকে ছবি পাঠান', 'Send a photo to an expert')}</button>
    <button class="btn ghost full" data-act="symReset">${IC.reset}${L('আবার শুরু', 'Start again')}</button>`;
  return h;
}

/* ===================== Actions ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button[data-act="closeSheet"]')) return;
  const a = el.dataset.act, ds = el.dataset;
  const v = cur();
  switch (a) {
    case 'tab': setTab(ds.tab); break;
    case 'back': back(); break;
    case 'open': {
      if (ds.view === 'addPond') { UI.draft = null; }
      if (ds.view === 'symptom') UI.sym = { step: 0, picks: [] };
      const params = { id: ds.id, sub: ds.sub, type: ds.type, kind: ds.kind };
      go(ds.view, params); break;
    }
    case 'sub': v.params.sub = ds.sub; render(false); break;
    case 'lang': S.lang = ds.val; save(); tick('lang'); render(false); break;
    case 'task': {
      if (ds.kind === 'feed') openQuickLog(ds.id);
      if (ds.kind === 'water') go('waterTest', { id: ds.id });
      if (ds.kind === 'sample') go('sample', { id: ds.id });
      break;
    }
    case 'quickLog': openQuickLog(ds.id || (v.params && v.params.id)); break;
    case 'qlPond': UI.ql.pond = ds.val; renderLayer(); break;
    case 'closeSheet': UI.sheet = null; renderLayer(); break;
    case 'confirmOk': { const f = UI.onOk; UI.sheet = null; renderLayer(); f && f(); break; }
    case 'inc': case 'dec': {
      const inp = document.getElementById(ds.for); const step = parseFloat(ds.step) || 1;
      let val = readNum(ds.for) || 0; val = a === 'inc' ? val + step : Math.max(parseFloat(ds.min || 0), val - step);
      inp.value = dig(Math.round(val * 100) / 100); break;
    }
    case 'pick': {
      const g = ds.group, val = ds.val;
      if (g === 'allYear') UI.draft.allYear = val === 'yes';
      else if (g === 'model') UI.draft.model = val;
      else if (g === 'smpSp') UI.smp.sp = val;
      else if (g === 'seSp') UI.se.sp = val;
      else if (g === 'lgCat') UI.lg.cat = val;
      else if (g === 'lgPond') UI.lg.pond = val;
      else if (g === 'csYear') { UI.cs.allYear = val; UI.cs.area = readNum('cs_area') || UI.cs.area; }
      else if (g === 'csModel') { UI.cs.model = val; UI.cs.area = readNum('cs_area') || UI.cs.area; }
      else if (g === 'cfSp') { stashCF(); UI.cf.sp = val; }
      else if (g === 'trSp') UI.trSp = val;
      else if (g === 'slSp') UI.sl.sp = val;
      else if (g === 'prDist') { UI.prName = readStr('pr_name'); UI.prDist = val; }
      else if (g === 'tkPond') UI.tkPond = val;
      else if (g === 'oPond') UI.oPond = val;
      // keep typed values for wizard step 1 & quick fields
      if (g === 'prDist') { render(false); const el2 = document.getElementById('pr_name'); if (el2) el2.value = UI.prName; break; }
      if (g === 'lgCat' || g === 'lgPond') { const amt = readNum('l_amt'), note = readStr('l_note'); render(false); if (amt !== null) document.getElementById('l_amt').value = dig(amt); document.getElementById('l_note').value = note; break; }
      if (g === 'seSp' || g === 'smpSp') { const keep = ['se_n', 's_n', 's_kg', 'se_w', 'se_kg'].map(id => [id, readNum(id)]); render(false); keep.forEach(([id, val]) => { const x = document.getElementById(id); if (x && val !== null) x.value = dig(val); }); break; }
      render(false); break;
    }
    case 'pondStep': {
      const d = UI.draft;
      if (cur().params.step === 1 || !cur().params.step) {
        if (document.getElementById('f_name')) {
          d.name = readStr('f_name'); d.area = readNum('f_area') || 0; d.depth = readNum('f_depth') || 0;
          if (!d.name) { toast(L('পুকুরের একটি নাম দিন', 'Please give the pond a name')); document.getElementById('f_name').focus(); return; }
          if (d.area <= 0) { toast(L('আয়তন ০-এর বেশি হতে হবে', 'Size must be more than 0')); return; }
        }
      }
      cur().params.step = +ds.step; render(true); break;
    }
    case 'savePond': {
      const d = UI.draft; const pid = 'p_' + uid();

      const counts = ds.nofish ? [] : Object.keys(m.mix).map(sp => [sp, Math.round(readNum('f_sp_' + sp) || 0)]).filter(x => x[1] > 0);
      commit(L('পুকুর যোগ হয়েছে', 'Pond added'), () => {
        S.ponds.push({ id: pid, name: d.name, area: d.area, depth: d.depth, allYear: d.allYear, start: today(), model: d.model });
        let cost = 0;
        counts.forEach(([sp, c]) => { S.stock.push({ id: uid(), pondId: pid, sp, type: 'release', count: c, w: fryW, price: SP[sp].fry, date: today() }); cost += c * SP[sp].fry; });
        if (cost) S.ledger.push({ id: uid(), pondId: pid, kind: 'exp', cat: 'fry', amount: Math.round(cost), date: today(), note: L('পোনা কেনা', 'Fry purchase') });
        (FEED_TIMES[(SP[Object.keys(m.mix)[0]] || SP.rui).type]).forEach(t => S.reminders.push({ id: uid(), pondId: pid, time: t, on: true }));
      });
      tick('addPond'); UI.draft = null; UI.stack = []; UI.tab = 'ponds'; go('pond', { id: pid }); break;
    }
    case 'saveEditPond': {
      const p = pondById(ds.id), name = readStr('e_name'), area = readNum('e_area'), depth = readNum('e_depth');
      if (!name || !area) { toast(L('নাম ও আয়তন দিন', 'Enter name and size')); return; }
      commit(L('পুকুরের তথ্য বদলানো হয়েছে', 'Pond updated'), () => { p.name = name; p.area = area; p.depth = depth || p.depth; });
      back(); break;
    }
    case 'askDelPond': confirmSheet(L('পুকুরটি মুছে ফেলবেন?', 'Delete this pond?'), L('হ্যাঁ, মুছুন', 'Yes, delete'), () => {
      const id = ds.id;
      commit(L('পুকুর মুছে ফেলা হয়েছে', 'Pond deleted'), () => { ['stock', 'logs', 'water', 'samples', 'ledger', 'reminders'].forEach(k => S[k] = S[k].filter(x => x.pondId !== id)); S.ponds = S.ponds.filter(p => p.id !== id); });

    }); break;
    case 'saveQuickLog': {
      const pid = UI.ql.pond, feed = readNum('ql_feed'), dead = Math.round(readNum('ql_dead') || 0), note = readStr('ql_note');
      if (feed === null || feed < 0) { toast(L('খাবারের পরিমাণ দিন', 'Enter feed amount')); return; }
      commit(L('আজকের খাতা সংরক্ষণ হয়েছে', "Today's log saved"), () => {
        const ex = S.logs.find(l => l.pondId === pid && l.date === today());
        if (ex) Object.assign(ex, { feedKg: feed, deaths: dead, note }); else S.logs.push({ id: uid(), pondId: pid, date: today(), feedKg: feed, deaths: dead, note });
      });
      tick('quickLog'); UI.sheet = null; render(false); break;
    }
    case 'sw': {
      const k = ds.key, val = parseFloat(ds.val);
      if (UI.wt) { UI.wt[k] = UI.wt[k] === val ? undefined : val; }
      el.parentElement.querySelectorAll('.sw').forEach(x => x.classList.toggle('sel', x === el && UI.wt[k] !== undefined)); break;
    }
    case 'saveWater': {
      const p = pondById(ds.id);
      const r = { id: uid(), pondId: p.id, date: today() };
      if (UI.wt.ph !== undefined) r.ph = UI.wt.ph;
      if (UI.wt.nh3 !== undefined) r.nh3 = UI.wt.nh3;
      if (UI.wt.no2 !== undefined) r.no2 = UI.wt.no2;
      ['do', 'temp', 'secchi'].forEach(k => { const x = readNum('w_' + k); if (x !== null) r[k] = x; });
      if (Object.keys(r).length <= 3) { toast(L('অন্তত একটি মাপ দিন', 'Enter at least one reading')); return; }
      commit(L('পানির পরীক্ষা সংরক্ষণ হয়েছে', 'Water test saved'), () => S.water.push(r));
      tick('water'); UI.wt = null;
      UI.stack.pop(); if (cur().view === 'pond') cur().params.sub = 'water'; else go('pond', { id: p.id, sub: 'water' });
      render(true);
      const dang = Object.keys(PARAMS).filter(k => r[k] !== undefined && band(k, r[k]) === 'danger').map(k => ({ k, v: r[k] }));
      if (dang.length) { dang.sort((a, b) => (a.k === 'do' ? -1 : 1)); dangerScreen(p, dang); }
      break;
    }
    case 'saveSample': {
      const c = Math.round(readNum('s_n') || 0), kg = readNum('s_kg') || 0;
      if (c < 1 || kg <= 0) { toast(L('মাছের সংখ্যা ও ওজন দিন', 'Enter number and weight')); return; }
      commit(L(`গড় ওজন ${n(kg * 1000 / c)} গ্রাম — সংরক্ষণ হয়েছে`, `Average ${Math.round(kg * 1000 / c)} g — saved`), () => S.samples.push({ id: uid(), pondId: ds.id, sp: UI.smp.sp, date: today(), n: c, totalG: Math.round(kg * 1000) }));
      tick('sample'); UI.smp = null; back(); if (cur().view === 'pond') { cur().params.sub = 'growth'; render(false); } break;
    }
    case 'saveStock': {
      const type = ds.type, c = Math.round(readNum('se_n') || 0);
      if (c < 1) { toast(L('মাছের সংখ্যা দিন', 'Enter number of fish')); return; }
      const live = (stockRows(ds.id).find(r => r.sp === UI.se.sp) || {}).live || 0;
      if (type !== 'release' && c > live) { toast(L(`পুকুরে মাত্র ${n(live)}টি আছে`, `Only ${live} in the pond`)); return; }
      const ev = { id: uid(), pondId: ds.id, sp: UI.se.sp, type, count: c, date: today() };
      let led = null;
      if (type === 'release') { ev.w = readNum('se_w') || 10; ev.price = readNum('se_p') || 0; if (ev.price) led = { kind: 'exp', cat: 'fry', amount: Math.round(ev.price * c), note: spName(ev.sp) + ' ' + n(c) }; }
      if (type === 'harvest') { ev.kg = readNum('se_kg') || 0; ev.price = readNum('se_p') || 0; if (ev.price && ev.kg) led = { kind: 'inc', cat: 'sale', amount: Math.round(ev.price * ev.kg), note: spName(ev.sp) + ' ' + n(ev.kg, 1) + ' ' + L('কেজি', 'kg') }; }
      commit(L('মাছের খাতা সংরক্ষণ হয়েছে', 'Fish record saved'), () => { S.stock.push(ev); if (led) S.ledger.push(Object.assign({ id: uid(), pondId: ds.id, date: today() }, led)); });
      tick('stock'); UI.se = null; back(); if (cur().view === 'pond') { cur().params.sub = 'fish'; render(false); } break;
    }
    case 'saveLedger': {
      const amt = readNum('l_amt');
      if (!amt || amt <= 0) { toast(L('টাকার পরিমাণ দিন', 'Enter an amount')); return; }
      if (!UI.lg.pond) { toast(L('আগে একটি পুকুর যোগ করুন', 'Add a pond first')); return; }
      commit(L('হিসাব সংরক্ষণ হয়েছে', 'Entry saved'), () => S.ledger.push({ id: uid(), pondId: UI.lg.pond, kind: ds.kind, cat: UI.lg.cat, amount: Math.round(amt), date: today(), note: readStr('l_note') }));
      tick('ledger'); UI.lg = null; back(); break;
    }
    case 'delLog': case 'delWater': case 'delSample': case 'delStock': case 'delLedger': {
      const key = { delLog: 'logs', delWater: 'water', delSample: 'samples', delStock: 'stock', delLedger: 'ledger' }[a];
      commit(L('মুছে ফেলা হয়েছে', 'Deleted'), () => S[key] = S[key].filter(x => x.id !== ds.id)); render(false); break;
    }
    case 'undo': if (UI.undo) { S = JSON.parse(UI.undo); UI.undo = null; save(); tick('undo'); UI.toast = null; render(false); toast(L('আগের অবস্থায় ফেরানো হয়েছে', 'Change undone')); } break;
    case 'symPick': {
      const p = UI.sym.picks, i = p.indexOf(ds.val);
      if (i >= 0) p.splice(i, 1); else p.push(ds.val);
      el.classList.toggle('sel'); break;
    }
    case 'symStep': UI.sym.step = Math.max(0, UI.sym.step + (+ds.d)); render(true); break;
    case 'symReset': UI.sym = { step: 0, picks: [] }; render(true); break;
    case 'csCalc': UI.cs.area = readNum('cs_area') || UI.cs.area; render(false); break;
    case 'cfCalc': stashCF(); render(false); break;
    case 'clPh': UI.cl.ph = parseFloat(ds.val); UI.cl.area = readNum('cl_area') || UI.cl.area; UI.cl.secchi = readNum('cl_secchi') ?? UI.cl.secchi; render(false); break;
    case 'clCalc': UI.cl.area = readNum('cl_area') || UI.cl.area; UI.cl.secchi = readNum('cl_secchi') ?? UI.cl.secchi; render(false); break;
    case 'fontSize': UI.fs = UI.fs >= 24 ? 16 : UI.fs + 2; render(false); break;
    case 'saveQ': {
      const q = readStr('q_text');
      if (q.length < 5) { toast(L('প্রশ্নটি একটু বিস্তারিত লিখুন', 'Please write a bit more')); return; }
      readPhoto('q_photo', photo => {
        commit(L('প্রশ্ন পাঠানো হয়েছে', 'Question sent'), () => S.questions.push({ id: uid(), mine: true, by: L('আমি', 'Me'), date: today(), q, a: '', photo }));
        tick('question'); back();
      });
      break;
    }
    case 'saveTicket': {
      const text = readStr('t_text');
      readPhoto('t_photo', photo => {
        commit(L('বিশেষজ্ঞের কাছে পাঠানো হয়েছে', 'Sent to an expert'), () => S.tickets.unshift({ id: uid(), pond: UI.tkPond || (S.ponds[0] && S.ponds[0].id), text, date: today(), status: 'answered',
          answer: L('ডেমো উত্তর: ছবিতে লাল দাগ দেখা যাচ্ছে। প্রতি শতাংশে ১ কেজি চুন ও ১ কেজি লবণ দিন, ২ দিন খাবার কম দিন, ৩ দিন পর আবার ছবি পাঠান।', 'Demo answer: the photo shows red spots. Apply 1 kg lime and 1 kg salt per decimal, feed less for 2 days, and send a new photo after 3 days.') }));
        tick('ticket'); render(false);
      });
      break;
    }
    case 'paywall': go('paywall', { need: ds.need, why: ds.why }); break;
    case 'setPlan': {
      S.plan = ds.plan; save(); if (ds.plan !== 'free') tick('plan');
      toast(L(`${planName(ds.plan)} প্ল্যান চালু হয়েছে (ডেমো)`, `${planName(ds.plan)} plan on (demo)`));
      if (cur().view === 'paywall') back(); else render(false); break;
    }
    case 'setDistrict': S.profile.district = ds.val; save(); render(false); break;
    case 'priceAlert': S.priceAlert = el.checked; save(); toast(el.checked ? L('দামের সতর্কতা চালু', 'Price alert on') : L('দামের সতর্কতা বন্ধ', 'Price alert off')); break;
    case 'placeOrder': {
      const p = PRODUCTS.find(x => x.id === ds.id), q = Math.max(1, Math.round(readNum('o_qty') || 1)), addL = document.getElementById('o_ledger') && document.getElementById('o_ledger').checked;
      const pid = UI.oPond || (S.ponds[0] && S.ponds[0].id);
      commit(L('অর্ডার হয়েছে — ডিলার ফোন করবে (ডেমো)', 'Ordered — the dealer will call (demo)'), () => {
        S.orders.push({ id: uid(), pid: p.id, qty: q, date: today(), status: 'placed' });
        if (addL && pid) S.ledger.push({ id: uid(), pondId: pid, kind: 'exp', cat: p.cat === 'feed' ? 'feed' : p.cat === 'care' ? 'med' : 'other', amount: p.price * q, date: today(), note: tx(p) + ' × ' + n(q) });
      });
      tick('order'); UI.stack = [{ view: 'orders', params: {} }]; render(true); break;
    }
    case 'saveListing': {
      const kg = readNum('sl_kg') || 0, price = readNum('sl_p') || 0, date = readStr('sl_date') || addDays(today(), 7);
      if (kg <= 0) { toast(L('কত কেজি দিন', 'Enter kg')); return; }
      commit(L('ক্রেতাদের কাছে পাঠানো হয়েছে (ডেমো)', 'Shared with buyers (demo)'), () => S.listings.push({ id: uid(), sp: UI.sl.sp, kg, price, date,
        bids: [{ who: L('আড়তদার জামাল, ' + tx(DISTRICTS[0]), 'Jamal Arot, ' + tx(DISTRICTS[0])), price: price - 5 }, { who: L('ফ্রেশ ফিশ সাপ্লাই', 'Fresh Fish Supply'), price: price + 3 }] }));
      tick('listing'); render(false); break;
    }
    case 'saveProfile': {
      S.profile.name = readStr('pr_name'); if (UI.prDist) S.profile.district = UI.prDist; UI.prDist = null; save(); toast(L('সংরক্ষণ হয়েছে', 'Saved')); back(); break;
    }
    case 'remToggle': { const r = S.reminders.find(x => x.id === ds.id); r.on = !r.on; save(); render(false); break; }
    case 'remDel': commit(L('মুছে ফেলা হয়েছে', 'Deleted'), () => S.reminders = S.reminders.filter(x => x.id !== ds.id)); render(false); break;
    case 'remAdd': { const t = readStr('rt_' + ds.id); if (!t) return; commit(L('সময় যোগ হয়েছে', 'Time added'), () => S.reminders.push({ id: uid(), pondId: ds.id, time: t, on: true })); render(false); break; }
    case 'remTest': { const p = S.ponds[0]; showReminder(p ? p.id : null, true); tick('reminder'); break; }
    case 'addTeam': { const nm = readStr('tm_name'); if (!nm) return; S.team = S.team || []; S.team.push({ name: nm }); save(); toast(L('কর্মী যোগ হয়েছে (ডেমো)', 'Worker added (demo)')); render(false); break; }
    case 'askReset': confirmSheet(ds.mode === 'demo' ? L('সব তথ্য মুছে নমুনা তথ্য ফেরত আনবেন?', 'Replace everything with sample data?') : L('সব তথ্য মুছে খালি অ্যাপ শুরু করবেন?', 'Delete everything and start empty?'), L('হ্যাঁ', 'Yes'), () => {
      const lang = S.lang, ck = S.checklist;
      S = ds.mode === 'demo' ? demoState() : emptyState(); S.lang = lang; S.checklist = ck; S.checklist.reset = true; save();
      UI.stack = []; UI.tab = 'today'; render(true); toast(ds.mode === 'demo' ? L('নমুনা তথ্য ফেরত এসেছে', 'Sample data restored') : L('খালি অ্যাপ শুরু', 'Started empty'));
    }); break;
    case 'checkToggle': S.checklist[ds.id] = !S.checklist[ds.id]; save(); render(false); break;
    case 'checkClear': S.checklist = {}; save(); render(false); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="checkbox"]')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && UI.sheet) { UI.sheet = null; renderLayer(); } });
function stashCF() { UI.cf.count = readNum('cf_n') || UI.cf.count; UI.cf.w = readNum('cf_w') || UI.cf.w; UI.cf.temp = readNum('cf_t') || UI.cf.temp; }
function readPhoto(id, cb) {
  const f = document.getElementById(id); const file = f && f.files && f.files[0];
  if (!file) { cb(null); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'), s = Math.min(1, 640 / Math.max(img.width, img.height)); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.7)); };
    img.onerror = () => cb(null); img.src = rd.result;
  };
  rd.onerror = () => cb(null); rd.readAsDataURL(file);
}
function showReminder(pid, test) {
  const p = pid && pondById(pid);
  const fp = p ? feedPlan(p.id) : null;
  UI.sheet = () => `<div class="scrim" data-act="closeSheet"><div class="sheet" role="alertdialog" aria-modal="true" data-stop="1"><div class="grab"></div>
    <div class="row"><span class="ring watch">${IC.bell}</span><div class="grow"><h2>${L('খাবার দেওয়ার সময়', 'Time to feed')}</h2><p class="muted">${p ? esc(p.name) : ''}${test ? ' · ' + L('পরীক্ষা', 'test') : ''}</p></div></div>
    ${fp ? `<div class="big-num num center">${n(fp.perMeal, 1)} ${L('কেজি', 'kg')}</div>` : ''}
    <div class="grid2"><button class="btn line" data-act="closeSheet">${L('পরে', 'Later')}</button><button class="btn primary" data-act="quickLog" data-id="${p ? p.id : ''}">${IC.check}${L('দিয়েছি', 'Done')}</button></div></div></div>`;
  renderLayer();
}
let lastFired = '';
setInterval(() => {
  const d = new Date(), hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (hm === lastFired) return;
  const r = S.reminders.find(x => x.on && x.time === hm && pondById(x.pondId));
  if (r && !UI.sheet) { lastFired = hm; showReminder(r.pondId, false); }
}, 20000);

/* ===================== Boot ===================== */
S = load();
render(true);
// Android hardware back button when wrapped as an app (Capacitor)
try { const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (App) App.addListener('backButton', () => { if (!window.mbBack()) App.exitApp(); }); } catch (e) {}
</script>
