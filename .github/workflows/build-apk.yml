name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange files
        run: |
          mkdir -p src scripts
          [ -f src/index.html ] || cp index.html src/index.html
          [ -f scripts/wrap.js ] || cp wrap.js scripts/wrap.js
      - run: npm install
      - run: node scripts/wrap.js
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk machbondhu-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: machbondhu-demo-apk
          path: machbondhu-demo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Machbondhu demo 0.1.${{ github.run_number }}
          body: Download machbondhu-demo.apk on your Android phone and open it to install.
          files: machbondhu-demo.apk
